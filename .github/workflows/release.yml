name: Build and Release

on:
  push:
    tags:
      - '*'
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build plugin
        run: npm run build

      - name: Verify build output
        run: |
          test -f main.js || { echo "main.js not found"; exit 1; }
          test -f manifest.json || { echo "manifest.json not found"; exit 1; }
          test -f styles.css || { echo "styles.css not found"; exit 1; }
          echo "✅ All required files present"

      - name: Create install ZIP
        run: |
          mkdir -p simple-sync
          cp main.js simple-sync/
          cp manifest.json simple-sync/
          cp styles.css simple-sync/
          zip -r simple-sync.zip simple-sync/

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            main.js
            manifest.json
            styles.css
            simple-sync.zip
          generate_release_notes: false
